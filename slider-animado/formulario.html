<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de contacto</title>
  <style>

    /* =====================================================
       @property — Shimmer animado del botón de envío
    ===================================================== */
    @property --shimmer-pos {
      syntax: '<percentage>';
      inherits: false;
      initial-value: -100%;
    }

    /* =====================================================
       @keyframes
    ===================================================== */
    @keyframes shimmer {
      to { --shimmer-pos: 250%; }
    }

    @keyframes card-enter {
      from { opacity: 0; translate: 0 24px; }
      to   { opacity: 1; translate: 0 0; }
    }

    @keyframes field-enter {
      from { opacity: 0; translate: 0 12px; }
      to   { opacity: 1; translate: 0 0; }
    }

    @keyframes check-draw {
      from { stroke-dashoffset: 40; }
      to   { stroke-dashoffset: 0; }
    }

    /* Orbs del panel izquierdo */
    @keyframes orb-float {
      0%, 100% { translate: 0 0; }
      50%       { translate: 8px -12px; }
    }


    /* =====================================================
       VARIABLES
    ===================================================== */
    :root {
      --accent:       #7c3aed;
      --accent-mid:   #6d28d9;
      --accent-light: #a78bfa;
      --card-bg:      #0d0c18;
      --panel-bg-1:   #3b1fa8;
      --panel-bg-2:   #1e1b4b;
      --input-bg:     rgba(255, 255, 255, 0.05);
      --input-border: rgba(255, 255, 255, 0.08);
      --text:         #ffffff;
      --text-muted:   rgba(255, 255, 255, 0.45);
      --label-color:  rgba(255, 255, 255, 0.5);

      --transition-fast: 180ms ease-out;
      --transition-base: 300ms ease-out;

      --text-xs:   0.7rem;
      --text-sm:   clamp(0.8rem, 0.5vw + 0.65rem, 0.9rem);
      --text-base: clamp(0.9rem, 0.4vw + 0.78rem, 1rem);
      --text-lg:   clamp(1.1rem, 0.6vw + 0.9rem,  1.3rem);
      --text-hero: clamp(1.8rem, 2vw  + 1rem,     2.6rem);
    }


    /* =====================================================
       RESET
    ===================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;

      /* Mesh gradient — inspirado en los fondos de los ejemplos */
      background-color: #110d22;
      background-image:
        radial-gradient(ellipse 70% 60% at 0%   0%,   rgba(255, 100, 50,  0.55) 0%, transparent 60%),
        radial-gradient(ellipse 55% 50% at 100% 0%,   rgba(180, 60,  200, 0.45) 0%, transparent 60%),
        radial-gradient(ellipse 60% 55% at 50%  100%, rgba(60,  80,  220, 0.4)  0%, transparent 60%);
    }


    /* =====================================================
       CARD — Contenedor principal
    ===================================================== */
    .card {
      width: min(900px, 100%);
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
      animation: card-enter 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
    }


    /* =====================================================
       CARD__TOPBAR — Barra con dots estilo macOS
    ===================================================== */
    .card__topbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card__dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .card__dot--red    { background: #ff5f57; }
    .card__dot--yellow { background: #febc2e; }
    .card__dot--green  { background: #28c840; }


    /* =====================================================
       CARD__BODY — Layout de dos columnas
    ===================================================== */
    .card__body {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
    }

    @media (max-width: 680px) {
      .card__body { grid-template-columns: 1fr; }
    }


    /* =====================================================
       PANEL — Columna izquierda con identidad visual
       Gradiente + patrón de cruces (inspirado en imagen 2)
    ===================================================== */
    .panel {
      position: relative;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 420px;
      overflow: hidden;

      background: linear-gradient(160deg, var(--panel-bg-1) 0%, var(--panel-bg-2) 100%);
    }

    /* Patrón de cruces encima del gradiente */
    .panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Orb decorativo flotante */
    .panel::after {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.35) 0%, transparent 70%);
      top: -60px;
      right: -60px;
      filter: blur(20px);
      animation: orb-float 6s ease-in-out infinite;
      pointer-events: none;
    }

    .panel__content {
      position: relative; /* encima del ::before */
    }

    .panel__tag {
      display: inline-block;
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-light);
      background: rgba(167, 139, 250, 0.12);
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 99px;
      padding: 0.25rem 0.75rem;
      margin-bottom: 1.25rem;
    }

    .panel__title {
      font-size: var(--text-hero);
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }

    .panel__text {
      font-size: var(--text-sm);
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 28ch;
    }

    /* Persona */
    .panel__person {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .panel__avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .panel__name {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text);
    }

    .panel__role {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: 2px;
    }


    /* =====================================================
       FORM — Columna derecha
    ===================================================== */
    .form {
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form__header { }

    .form__title {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    .form__subtitle {
      font-size: var(--text-sm);
      color: var(--text-muted);
    }


    /* =====================================================
       FORM__GRID — Layout de campos
       Dos columnas para nombre/email, full-width para mensaje
    ===================================================== */
    .form__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form__field--full {
      grid-column: 1 / -1;
    }

    @media (max-width: 480px) {
      .form__grid { grid-template-columns: 1fr; }
    }


    /* =====================================================
       FORM__FIELD — Wrapper de cada campo
       Animación de entrada escalonada con animation-delay
    ===================================================== */
    .form__field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      animation: field-enter 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .form__field:nth-child(1) { animation-delay: 0.15s; }
    .form__field:nth-child(2) { animation-delay: 0.22s; }
    .form__field:nth-child(3) { animation-delay: 0.29s; }
    .form__field:nth-child(4) { animation-delay: 0.36s; }


    /* =====================================================
       FORM__LABEL — Etiqueta encima del input
       Estilo ALL-CAPS pequeño (inspirado en imagen 1)
    ===================================================== */
    .form__label {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--label-color);
      transition: color var(--transition-fast);
    }

    /* La label se ilumina cuando el campo está activo */
    .form__field:focus-within .form__label {
      color: var(--accent-light);
    }


    /* =====================================================
       FORM__INPUT
       Border sutil que se ilumina con glow en focus
    ===================================================== */
    .form__input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: var(--text-sm);
      font-family: inherit;
      color: var(--text);
      outline: none;
      resize: none;
      transition:
        border-color var(--transition-fast),
        box-shadow   var(--transition-fast);
    }

    .form__input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    /* Glow en foco — borde iluminado + sombra */
    .form__input:focus {
      border-color: var(--accent-light);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }


    /* =====================================================
       FORM__FOOTER — Checkbox + botón
    ===================================================== */
    .form__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Checkbox personalizado */
    .form__check {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      cursor: pointer;
    }

    .form__check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
    }

    .form__check-text {
      font-size: var(--text-xs);
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 22ch;
    }

    .form__check-text a {
      color: var(--accent-light);
      text-underline-offset: 2px;
    }


    /* =====================================================
       FORM__BTN — Botón de envío con shimmer
    ===================================================== */
    .form__btn {
      position: relative;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: var(--text-sm);
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      flex-shrink: 0;
      transition:
        background    var(--transition-fast),
        scale         var(--transition-fast);
    }

    /* Shimmer con @property */
    .form__btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent var(--shimmer-pos),
        rgba(255,255,255,0.2) calc(var(--shimmer-pos) + 60px),
        transparent calc(var(--shimmer-pos) + 120px)
      );
      animation: shimmer 2s ease-in-out infinite;
    }

    .form__btn:hover  { background: var(--accent-mid); }
    .form__btn:active { scale: 0.97; }
    .form__btn:focus-visible {
      outline: 2px solid var(--accent-light);
      outline-offset: 3px;
    }

    .form__btn-icon {
      transition: translate var(--transition-fast);
    }

    .form__btn:hover .form__btn-icon { translate: 3px 0; }


    /* =====================================================
       FORM--SUCCESS — Estado de envío exitoso
       JS añade la clase, CSS maneja la animación
    ===================================================== */
    .form--success .form__grid,
    .form--success .form__footer {
      display: none;
    }

    .form__success {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.75rem;
      padding: 1rem 0;
    }

    .form--success .form__success { display: flex; }

    .form__success-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(167, 139, 250, 0.3);
      display: grid;
      place-items: center;
    }

    .form__success-check {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: check-draw 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards;
    }

    .form__success-title {
      font-weight: 700;
      color: var(--text);
      font-size: var(--text-base);
    }

    .form__success-text {
      font-size: var(--text-sm);
      color: var(--text-muted);
    }


    /* =====================================================
       ACCESIBILIDAD
    ===================================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

  </style>
</head>
<body>

  <div class="card">

    <!-- Barra superior estilo macOS -->
    <div class="card__topbar">
      <span class="card__dot card__dot--red"></span>
      <span class="card__dot card__dot--yellow"></span>
      <span class="card__dot card__dot--green"></span>
    </div>

    <div class="card__body">

      <!-- ── Panel izquierdo — identidad ── -->
      <div class="panel">
        <div class="panel__content">
          <span class="panel__tag">Disponible ahora</span>
          <h1 class="panel__title">Hablemos de tu proyecto</h1>
          <p class="panel__text">
            Cuéntame en qué puedo ayudarte y te respondo en menos de 24 horas.
          </p>

          <div class="panel__person">
            <div class="panel__avatar">👨‍💻</div>
            <div>
              <p class="panel__name">Jordan Cruz</p>
              <p class="panel__role">Frontend Developer · AlexCG</p>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Panel derecho — formulario ── -->
      <form class="form" novalidate>

        <div class="form__header">
          <h2 class="form__title">Envíame un mensaje</h2>
          <p class="form__subtitle">Todos los campos son requeridos</p>
        </div>

        <!-- Estado de éxito -->
        <div class="form__success" aria-live="polite">
          <div class="form__success-icon">
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none"
              stroke="#a78bfa" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline class="form__success-check" points="4,13 10,19 22,7"/>
            </svg>
          </div>
          <p class="form__success-title">¡Mensaje enviado!</p>
          <p class="form__success-text">Te respondo pronto.</p>
        </div>

        <div class="form__grid">

          <div class="form__field">
            <label class="form__label" for="name">Nombre completo</label>
            <input class="form__input" type="text" id="name"
              placeholder="Tu nombre" autocomplete="name" required>
          </div>

          <div class="form__field">
            <label class="form__label" for="email">Correo electrónico</label>
            <input class="form__input" type="email" id="email"
              placeholder="tu@email.com" autocomplete="email" required>
          </div>

          <div class="form__field">
            <label class="form__label" for="company">Empresa</label>
            <input class="form__input" type="text" id="company"
              placeholder="Nombre de tu empresa">
          </div>

          <div class="form__field">
            <label class="form__label" for="phone">Teléfono</label>
            <input class="form__input" type="tel" id="phone"
              placeholder="+52 000 000 0000" autocomplete="tel">
          </div>

          <div class="form__field form__field--full">
            <label class="form__label" for="message">Mensaje</label>
            <textarea class="form__input" id="message" rows="3"
              placeholder="Cuéntame sobre tu proyecto..." required></textarea>
          </div>

        </div>

        <div class="form__footer">
          <label class="form__check">
            <input type="checkbox" required>
            <span class="form__check-text">
              Acepto el tratamiento de mis datos según la
              <a href="#">política de privacidad</a>
            </span>
          </label>

          <button class="form__btn" type="submit">
            Enviar mensaje
            <span class="form__btn-icon" aria-hidden="true">→</span>
          </button>
        </div>

      </form>

    </div><!-- /.card__body -->
  </div><!-- /.card -->


  <script>
    document.querySelector('.form').addEventListener('submit', e => {
      e.preventDefault();
      e.currentTarget.classList.add('form--success');
    });
  </script>

</body>
</html>
